services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webhooks_dev
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
